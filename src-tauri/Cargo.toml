[package]
name = "reallynoted"
version = "0.1.0"
description = "Local-first notes and transcription workspace"
authors = ["ReallyNoted contributors"]
edition = "2021"

[lib]
name = "note_y_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
